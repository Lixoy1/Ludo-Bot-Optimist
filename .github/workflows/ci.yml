name: CI
permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate canonical board artifacts
        run: npm run build
      - name: Check generated board artifacts are committed
        run: git diff --exit-code -- Coordinates_Map.json
      - name: Install SVG rasterizer
        run: npm install --no-save --package-lock=false sharp
      - name: Render visual board preview as PNG
        run: npm run build:preview:png
      - name: Commit generated visual previews
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CLASSIC-BOARD-TOKEN-PREVIEW.svg docs/CLASSIC-BOARD-TOKEN-PREVIEW.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate updated classic board visual previews"
            git push
          fi
      - name: Run geometry and pawn tests
        run: npm test
      - name: Check source syntax
        run: npm run check
