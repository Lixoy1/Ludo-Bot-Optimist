name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export canonical coordinates
        run: npm run build:coordinates
      - name: Check generated coordinate map is committed
        run: git diff --exit-code -- Coordinates_Map.json
      - name: Run geometry and pawn tests
        run: npm test
      - name: Check source syntax
        run: npm run check
