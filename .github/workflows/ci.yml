name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate canonical board artifacts
        run: npm run build
      - name: Check generated board artifacts are committed
        run: git diff --exit-code -- Coordinates_Map.json docs/CLASSIC-BOARD-TOKEN-PREVIEW.svg
      - name: Run geometry and pawn tests
        run: npm test
      - name: Check source syntax
        run: npm run check
