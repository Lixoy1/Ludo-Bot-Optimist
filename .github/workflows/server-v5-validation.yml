name: Server v5 validation

on:
  push:
    branches: [release/v5-server-ready]
  pull_request:
    branches: [main]

jobs:
  validate-server-v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r server-v5/requirements.txt
      - name: Compile Python server
        run: python -m py_compile server-v5/server.py
      - name: Check room deep-link parsing
        run: |
          node server-v5/test_room_link.js
      - name: Check lobby timer and quick-start controls
        run: |
          grep -q 'id="lobby-countdown"' server-v5/index.html
          grep -q 'id="lobby-start-bots"' server-v5/index.html
          grep -q 'START_WITH_BOTS' server-v5/static/js/main.js
          grep -q 'lobby_deadline' server-v5/server.py
          grep -q 'def render_game_page_html' server-v5/server.py
          grep -q 'window.__LUDO_SERVER_ROOM_CODE__' server-v5/index.html
          grep -q 'bootRoomConnection' server-v5/static/js/main.js
          grep -q 'def room_webapp_url' server-v5/server.py
          grep -q 't.me/Ludo_optimist_bot?startapp=join_' server-v5/server.py
          grep -q 'url=room_webapp_url(code)' server-v5/server.py
          grep -q 'def render_tg_lobby_kb' server-v5/server.py
          grep -q 'def upload_room_voice' server-v5/server.py
          grep -q 'def get_room_voice' server-v5/server.py
          grep -q 'VOICE_SESSIONS\[voice_session_token\]' server-v5/server.py
          grep -q 'data.event === "VOICE_SESSION"' server-v5/static/js/main.js
          grep -q 'function setPlayers(list, spectators)' server-v5/static/js/voice.js
          grep -q 'data.event === "ROOM_MEMBERS"' server-v5/static/js/main.js
          grep -q 'function createLudoVoicePlayer' server-v5/static/js/main.js
          grep -q 'audioBitsPerSecond: 32_000' server-v5/static/js/main.js
          grep -q 'addEventListener("pointerdown"' server-v5/static/js/main.js
          grep -q 'addEventListener("pointerup"' server-v5/static/js/main.js
          grep -q 'Доступ к микрофону сохранён. Теперь зажми кнопку и говори.' server-v5/static/js/main.js
          grep -q 'hasLiveCachedStream' server-v5/static/js/main.js
          grep -q 'voicePermissionPromptPending' server-v5/static/js/main.js
          grep -q 'Do not reconnect the game socket while getUserMedia is awaiting that sheet.' server-v5/static/js/main.js
          grep -q 'Отпусти, чтобы отправить голосовое' server-v5/static/js/main.js
          ! grep -q 'onclick="toggleVoiceNoteRecording()"' server-v5/index.html
          grep -q 'function createLudoVoicePlayer' server-v5/static/js/main.js
          grep -q 'void showCharacterSelection()' server-v5/static/js/main.js
      - name: Check browser JavaScript syntax
        run: |
          node --check server-v5/static/js/main.js
          node --check server-v5/static/js/voice.js
          grep -q 'Telegram must receive ready() immediately' server-v5/static/js/main.js
          grep -q 'try { if (typeof tg.ready === "function") tg.ready(); }' server-v5/static/js/main.js
          python - <<'PY'
          from pathlib import Path
          import re
          for page in ("index.html", "cabinet.html"):
              html = Path("server-v5", page).read_text(encoding="utf-8")
              scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
              if not scripts:
                  raise SystemExit(f"{page} inline script not found")
              Path(f"/tmp/{page}-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/index.html-inline.js
          node --check /tmp/cabinet.html-inline.js
      - name: Test AI opponents, opening dice and both start paths
        run: |
          cd server-v5
          APP_ENV=development DATABASE_PATH=/tmp/optimist-ludo-bot-tests.db python -m unittest test_game_bots.py -v
      - name: Smoke-test FastAPI routes
        run: |
          cd server-v5
          APP_ENV=development DATABASE_PATH=/tmp/optimist-ludo-ci.db uvicorn server:app --host 127.0.0.1 --port 8765 >/tmp/optimist-ludo-uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/healthz >/tmp/healthz.json; then break; fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/healthz.json
          curl --silent --fail http://127.0.0.1:8765/ >/tmp/ludo-index.html
          curl --silent --fail http://127.0.0.1:8765/room/ABC123 >/tmp/ludo-room-path.html
          curl --silent --fail 'http://127.0.0.1:8765/?startapp=join_ABC123' >/tmp/ludo-room-query.html
          curl --silent --fail http://127.0.0.1:8765/cabinet >/tmp/ludo-cabinet.html
          voice_status=$(curl --silent --output /tmp/voice-auth.json --write-out '%{http_code}' -X POST -H 'content-type: audio/webm' --data-binary '' http://127.0.0.1:8765/api/rooms/ABC123/voice)
          test "$voice_status" = "401"
          grep -q 'character-select-overlay' /tmp/ludo-index.html
          grep -q 'window.__LUDO_SERVER_ROOM_CODE__ = "ABC123";' /tmp/ludo-room-path.html
          grep -q 'window.__LUDO_SERVER_ROOM_CODE__ = "ABC123";' /tmp/ludo-room-query.html
          grep -q 'id="skins"' /tmp/ludo-cabinet.html
