services:
  - type: web
    name: optimist-ludo
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: server-v5
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: ALLOW_DEV_AUTH
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PATH
        value: /tmp/ludo.db
